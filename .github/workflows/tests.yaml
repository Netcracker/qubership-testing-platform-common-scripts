---
# Runs the Bats tests under tests/: smoke tests that check every script still parses and defines its
# functions, and unit tests for the helpers that do not belong to a single runner.
name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Bats
        run: |
          npm install --prefix "$RUNNER_TEMP/bats" bats@1.11.1
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: bats --recursive --print-output-on-failure tests
